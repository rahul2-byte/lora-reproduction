[project]
name = "lora-reproduction"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets",
    "matplotlib",
    "numpy",
    "peft",
    "scikit-learn",
    "torch",
    "transformers",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
lora-study = "lora_study.cli:main"
pipeline = "lora_study.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_study"]
